name: Recording

# Records a walkthrough of the real app and publishes MP4 + GIF to the 'recording' branch.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/record.mjs'
      - '.github/workflows/recording.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, intl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Boot app with fictional data
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/; s/^DB_DATABASE=vendra/# DB_DATABASE=/; s/^VENDRA_ENFORCE_MFA=true/VENDRA_ENFORCE_MFA=false/' .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          (php artisan serve --port=8000 > storage/logs/serve.log 2>&1 &)
          sleep 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/record.mjs
      - name: Convert to MP4 and GIF
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          cd recording
          ffmpeg -loglevel error -y -i raw.webm -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p -movflags +faststart -an vendra-demo.mp4
          ffmpeg -loglevel error -y -i raw.webm -vf "fps=8,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=128[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" vendra-demo.gif
          ffmpeg -loglevel error -y -ss 15 -i raw.webm -frames:v 1 -q:v 3 poster.jpg
          find . -maxdepth 1 -name '*.webm' ! -name raw.webm -delete
          rm raw.webm
          ls -la
      - name: Publish to the 'recording' branch
        run: |
          cd recording
          git init -q -b recording
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Recording for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" recording
