name: Screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - 'resources/views/**'
      - 'public/css/**'
      - 'scripts/screenshots.mjs'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, intl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Boot app with fictional data
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/; s/^DB_DATABASE=vendra/# DB_DATABASE=/; s/^VENDRA_ENFORCE_MFA=true/VENDRA_ENFORCE_MFA=false/' .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          (php artisan serve --port=8000 > storage/logs/serve.log 2>&1 &)
          sleep 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/screenshots.mjs
      - if: always()
        run: cp storage/logs/*.log screenshots/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
