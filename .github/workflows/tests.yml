name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare environment (SQLite, fictional data)
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=vendra/# DB_DATABASE=/' .env
          php artisan key:generate
          touch database/database.sqlite
      - name: Feature and unit tests
        run: php artisan test
      - name: Seed demo data
        run: php artisan migrate:fresh --seed --force
      - name: AI evaluation (offline rules engine, 60 fictional cases)
        run: php artisan vendra:ai-eval --provider=rules
