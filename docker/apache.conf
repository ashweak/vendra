<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    # CSS links carry a ?v=<file time> version, so browsers can keep them for a year.
    <FilesMatch "\.css$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.(woff2|ico|png|svg|webp|jpe?g)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>

    # Uploaded pictures are re-encoded images only; never run anything from there.
    <Location "/storage/">
        php_admin_flag engine off
        Options -ExecCGI
    </Location>

    # Compress text responses (pages, CSS, chat JSON) for slower mobile connections.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml
    </IfModule>

    # Laravel sends the full set (including CSP and HSTS) on pages; these cover static files only.
    Header setifempty X-Content-Type-Options "nosniff"
    Header setifempty Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
